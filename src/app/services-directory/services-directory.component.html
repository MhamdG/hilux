<div class="content-wrapper">
  <!-- Content Header -->
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-12 text-center">
          <h1 class="m-0 text-dark">{{ isRTL ? 'دليل الخدمات' : 'Services Directory' }}</h1>
        </div>
      </div>
    </div>
  </div>

  <section class="content">
    <div class="container-fluid">
      <!-- Search and Filter Card -->
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div class="card-header">
              <h5 class="card-title">{{ isRTL ? 'تصفية العرض' : 'Filter View' }}</h5>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>{{ isRTL ? 'بحث' : 'Search' }}</label>
                    <input
                      type="text"
                      class="form-control"
                      [(ngModel)]="searchQuery"
                      [placeholder]="isRTL ? 'ابحث باسم الخدمة...' : 'Search by service name...'"
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label>{{ isRTL ? 'الفئة' : 'Category' }}</label>
                    <select class="form-control" (change)="setActiveCategory($any($event.target).value)">
                      <option value="all">{{ isRTL ? 'جميع الفئات' : 'All Categories' }}</option>
                      <option *ngFor="let cat of categories" [value]="cat.serviceCategorySlug" [selected]="activeCategory === cat.serviceCategorySlug">
                        {{ getText(cat.serviceCategoryName) }} ({{ cat.services?.length || 0 }})
                      </option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading State -->
      <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>

      <!-- Error State -->
      <div *ngIf="error" class="alert alert-danger text-center">
        {{ error }}
        <br />
        <button (click)="loadCategories()" class="btn btn-outline-danger mt-2">
          {{ isRTL ? 'إعادة المحاولة' : 'Retry' }}
        </button>
      </div>

      <!-- Services List -->
      <div *ngIf="!isLoading && !error">
        <div class="row" *ngIf="filteredItems.length > 0">
          <div class="col-lg-3 col-md-4 col-sm-6" *ngFor="let item of filteredItems">
            <div class="card card-primary card-outline" style="cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 4px 8px rgba(0,0,0,0.1)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';" (click)="navigateToService(item.service)">
              <div class="card-body text-center d-flex flex-column align-items-center justify-content-between" style="min-height: 180px;">
                <img *ngIf="item.service.icon" [src]="item.service.icon" alt="" style="width: 50px; height: 50px; margin-bottom: 15px;" />
                <svg *ngIf="!item.service.icon" style="width: 50px; height: 50px; margin-bottom: 15px; color: #007bff;" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
                </svg>
                <h5 class="w-100 mb-3" style="font-size: 1rem; font-weight: bold; line-height: 1.4;">{{ getServiceTitle(item.service) }}</h5>
                <span class="text-muted" style="font-size: 0.85rem;"><i class="fas" [ngClass]="isRTL ? 'fa-arrow-circle-left' : 'fa-arrow-circle-right'"></i> {{ isRTL ? 'التفاصيل' : 'Details' }}</span>
              </div>
            </div>
          </div>
        </div>

        <div *ngIf="filteredItems.length === 0" class="alert alert-info text-center">
          <i class="fas fa-info-circle mb-2" style="font-size: 2rem;"></i><br/>
          {{ isRTL ? 'لا توجد خدمات مطابقة لنتيجة البحث.' : 'No services match your search.' }}
        </div>
      </div>
    </div>
  </section>
</div>
