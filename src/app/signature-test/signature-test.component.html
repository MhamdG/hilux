<div class="content-wrapper">
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0 text-dark">Component Signature Test</h1>
        </div>
      </div>
    </div>
  </div>

  <section class="content">
    <div class="container-fluid">
      <div class="card card-primary">
        <div class="card-header">
          <h3 class="card-title">Testing the SignatureCollectionFieldComponent</h3>
        </div>
        <div class="card-body p-3">
          
          <!-- Drop in the new reusable component! -->
          <app-signature-collection-field 
             [field]="myMockField"
             [formData]="formData"
             [fullFormData]="{}"
             [formErrors]="{}">
          </app-signature-collection-field>

        </div>
        
        <!-- Quick debugging to show that formData is capturing properly -->
        <div class="card-footer bg-light mt-3" *ngIf="(formData | json) != '{}'">
          <h5 class="text-success"><i class="fas fa-check-circle"></i> Captured FormData:</h5>
          <pre class="bg-dark text-light p-3 rounded" style="overflow-x: auto;">{{ formData | json }}</pre>
        </div>
      </div>
    </div>
  </section>
</div>
