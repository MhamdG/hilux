<div class="content-wrapper">
  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <!-- <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
          </ol>
        </div> -->
      </div>
    </div><!-- /.container-fluid -->
  </section>
  <section class="content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12" *ngIf="profile$ | async as profile">
          <div class="card card-purple">
            <div class="card-header">
              <h3 class="card-title"> تقييم الأراضي </h3>
            </div>
          
           

            <router-outlet></router-outlet>
            <section class="content" *ngIf="formData && !formData.id">
              <div class="container-fluid">
                <app-alerts [errors]="formErrors"></app-alerts>
                <form class="form-horizontal" (ngSubmit)="saveData(searchData)" #sf="ngForm"
                  enctype='multipart/form-data' novalidate>
                  <div class="card-body">
                    <div class="form-group row">
                      <div class="col-sm-6">
                        <div class="form-group row">
                          <label class="col-sm-3 col-form-label" i18n="@@landProfileSearchLandId">Land Id</label>
                          <div class="col-sm-9">
                            <ng-select class="rtl" [items]="landNameOptions | async" name="LandNameSearch"
                              [hideSelected]="true" [minTermLength]="1" [(ngModel)]="searchData.term"
                              [loading]="landNameOptionsLoading" bindLabel="value.ar" bindValue="value.entityId"
                              typeToSearchText="Please enter 1 or more characters" notFoundText="لا يوجد نتائج للبحث"
                              [typeahead]="searchLandNameInput$" (keyup)="setSearchType('term', $event)"
                              [disabled]="isSearchBy('searchOldLandId')" (blur)="checkTypeAndValues('term')"
                              #LandNameSearch="ngModel">
                            </ng-select>
                          </div>
                        </div>
                      </div>
                      <div class="col-sm-6">
                        <div class="form-group row">
                          <label class="col-sm-3 col-form-label" i18n="@@ratingLabel">Land Id</label>
                          <div class="col-sm-9">
                            <input type="number" name="rating" required="true" class="form-control"
                            [(ngModel)]="searchData.rating" #rating="ngModel">
                          </div>
                        </div>
                      </div>
                      
                     
                    </div>
                  </div>
                  <div class="card-footer text-center">
                    <button type="submit" class="btn btn-primary" [disabled]="sf.invalid"
                      i18n="@@generalSubmit">Submit</button>
                  </div>
                </form>
                <hr />
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
