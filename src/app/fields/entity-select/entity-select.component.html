<div class="form-group">
  <table class="table table-bordered table-responsive d-table">
    <thead>
      <tr *ngFor="let dataOption of dataOptions | slice:0:1">
        <th *ngFor="let pair of dataOption.rowFields | keyvalue">{{pair.key}}</th>
        <th *ngIf="dataOption?.entityType == 'ownerDetails'" class="text-center">صفحة متعامل</th>
        <th *ngIf="!dataOption.entityType" class="text-center">Selected</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let field_detail of dataOptions; let i = index">
        <!-- <td *ngFor="let item of field_detail.rowFields | keyvalue">{{item.value}}</td> -->
        <td *ngFor="let item of field_detail.rowFields | keyvalue">
          <span  *ngIf="item.value && item.value.toString().startsWith('http');">
            <a href="{{item.value}}" target="_blank">
              <i class="fa fa-file-pdf"></i>
            </a>
          </span>
          <span  *ngIf="item.value && !item.value.toString().startsWith('http');">
            {{item.value}}
          </span>
        </td>
        <!-- <td *ngIf="!item.value.startsWith('http');" *ngFor="let item of field_detail.rowFields | keyvalue">Text</td> -->
        <td class="text-center">
          <div class="form-group">
            <a *ngIf="field_detail?.entityType == 'ownerDetails'" target="_blank" class="btn btn-primary" 
            [href]="navigateFun(field_detail.entityID,'owner')"
            role="button">عرض</a>
            <div *ngIf="!field_detail.entityType" class="form-check">
              <input class="form-check-input m-0"
                type="checkbox"
                [class]="customClass"
                [value]="field_detail.entityID"
                (change)="handleChange($event)"
                [checked]="isChecked(field_detail.entityID)"
                [disabled]="isActiveEditStep() || isActiveRejectStep()"
              />
            </div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  <input type="hidden" [name]="getName(field.fieldName.en)" [required]="isRequired()" #ngModel="ngModel" [(ngModel)]="formData[field.fieldID]">

    <div *ngIf="hasErrors() || showErrors(field.fieldID)" class="alert alert-danger">

    <div *ngIf="hasErrors()">
      {{getText(field, 'errorMsg')}}
    </div>

    <div *ngIf="showErrors(field.fieldID)">
      {{getErrors(field.fieldID)}}
    </div>
  </div>
</div>
